<!DOCTYPE html>
<html lang="es" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <meta name="theme-color" content="#ffffff">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <title>LenguaQuest - Ruta de las Palabras</title>
  
  <!-- Fonts: Fredoka & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 6.5.1 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- React & React DOM UMD -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Framer Motion -->
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- Babel Standalone -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Banco de Preguntas -->
  <script src="questions.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            display: ['Fredoka', 'sans-serif'],
          },
          colors: {
            duoGreen: '#58cc02',
            duoGreenDark: '#46a302',
            duoBlue: '#1cb0f6',
            duoBlueDark: '#1899d6',
            duoOrange: '#ff9600',
            duoOrangeDark: '#e08400',
            duoPurple: '#ce82ff',
            duoPurpleDark: '#b060e0',
            duoRed: '#ff4b4b',
            duoRedDark: '#ea2b2b',
            duoYellow: '#ffc800',
            duoYellowDark: '#e0b000',
            duoEmerald: '#10b981',
            duoEmeraldDark: '#059669',
            duoBgSuccess: '#d7ffb8',
            duoTextSuccess: '#58a700',
            duoBgError: '#ffdfe0',
            duoTextError: '#ea2b2b',
            duoPink:'#F472B6',
            duoPurblue:'#844ae8',
            duoCyan:'#4ae894',

          },
          boxShadow: {
            'duo-3d': '0 6px 0 0 rgba(0, 0, 0, 0.1)',
            'btn-green': '0 6px 0 0 #46a302',
            'btn-blue': '0 6px 0 0 #1899d6',
            'btn-orange': '0 6px 0 0 #e08400',
            'btn-purple': '0 6px 0 0 #b060e0',
            'btn-red': '0 6px 0 0 #ea2b2b',
            'btn-yellow': '0 6px 0 0 #e0b000',
            'btn-slate': '0 6px 0 0 #cbd5e1',
            'btn-emerald': '0 6px 0 0 #059669',
            'duo-card': '0 4px 0 0 #e2e8f0',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #ffffff;
      color: #1E293B;
      user-select: none;
      overflow-x: hidden;
      background-image: radial-gradient(#f1f5f9 2px, transparent 2px);
      background-size: 24px 24px;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    html.dark body {
      background-color: #0f172a;
      color: #f8fafc;
      background-image: radial-gradient(#1e293b 2px, transparent 2px);
    }

    .duo-pressable:active {
      transform: translateY(6px) !important;
      box-shadow: none !important;
    }
    
    .duo-card-pressable:active {
      transform: translateY(4px) !important;
      box-shadow: none !important;
    }

    @keyframes shake {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      15% { transform: translate(-12px, 8px) rotate(-1deg); }
      30% { transform: translate(12px, -8px) rotate(1deg); }
      45% { transform: translate(-8px, -6px) rotate(-0.5deg); }
      60% { transform: translate(8px, 6px) rotate(0.5deg); }
      75% { transform: translate(-4px, 2px); }
    }
    .screen-shake {
      animation: shake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes flashRed {
      0% { box-shadow: inset 0 0 0 0 rgba(255, 75, 75, 0); }
      30% { box-shadow: inset 0 0 60px 15px rgba(255, 75, 75, 0.45); }
      100% { box-shadow: inset 0 0 0 0 rgba(255, 75, 75, 0); }
    }
    .flash-red {
      animation: flashRed 0.5s ease-out;
    }

    @keyframes flashGreen {
      0% { box-shadow: inset 0 0 0 0 rgba(88, 204, 2, 0); }
      30% { box-shadow: inset 0 0 60px 15px rgba(88, 204, 2, 0.45); }
      100% { box-shadow: inset 0 0 0 0 rgba(88, 204, 2, 0); }
    }
    .flash-green {
      animation: flashGreen 0.5s ease-out;
    }

    @keyframes floatDuo {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    .animate-float-duo {
      animation: floatDuo 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen selection:bg-duoGreen selection:text-white flex flex-col justify-between">
  <div id="root" class="flex-1 flex flex-col"></div>

  <footer class="w-full text-center text-xs font-bold text-slate-400 dark:text-slate-500 py-6 border-t-2 border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 transition-colors">
    LenguaQuest — Plataforma Interactiva de Lengua Castellana y Literatura. Versión PRO (Libre de Anuncios).
  </footer>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    // --- SINTETIZADOR DE AUDIO ---
    const playSound = (type) => {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') ctx.resume();

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        const now = ctx.currentTime;

        if (type === 'pop') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(400, now);
          osc.frequency.exponentialRampToValueAtTime(800, now + 0.05);
          gain.gain.setValueAtTime(0.15, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
          osc.start(now);
          osc.stop(now + 0.05);
        } else if (type === 'success') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          osc.frequency.setValueAtTime(1046.50, now + 0.24);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
          osc.start(now);
          osc.stop(now + 0.45);
        } else if (type === 'error') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.exponentialRampToValueAtTime(120, now + 0.3);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'heal') {
          osc.type = 'triangle';
          [350, 450, 550, 700, 900].forEach((freq, idx) => {
            osc.frequency.setValueAtTime(freq, now + idx * 0.07);
          });
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
          osc.start(now);
          osc.stop(now + 0.5);
        } else if (type === 'cpr') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(350, now + 0.08);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'heartbeat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(80, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
          gain.gain.setValueAtTime(0.4, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'lifeGain') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, now);
          osc.frequency.setValueAtTime(880.00, now + 0.1);
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.start(now);
          osc.stop(now + 0.35);
        } else if (type === 'gemGain') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(783.99, now);
          osc.frequency.setValueAtTime(1174.66, now + 0.08);
          gain.gain.setValueAtTime(0.25, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.3);
        } else if (type === 'fanfare') {
          osc.type = 'triangle';
          [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((freq, idx) => {
            osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          });
          gain.gain.setValueAtTime(0.3, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.65);
          osc.start(now);
          osc.stop(now + 0.65);
        }
      } catch (e) {
        console.warn("Audio no permitido", e);
      }
    };

    const triggerConfetti = () => {
      if (window.confetti) {
        window.confetti({
          particleCount: 100,
          spread: 80,
          origin: { y: 0.6 },
          colors: ['#58cc02', '#1cb0f6', '#ff9600', '#ce82ff', '#ffc800']
        });
      }
    };

    // --- PANTALLA DE RESULTADOS ---
    function ResultsView({ resultData, setCurrentView }) {
      const { stars, moduleName, xpEarned } = resultData;

      useEffect(() => {
        playSound('fanfare');
        setTimeout(() => triggerConfetti(), 300);
      }, []);

      return (
        <div className="max-w-2xl mx-auto flex flex-col items-center justify-center space-y-8 py-12 text-center">
          <h2 className="text-4xl sm:text-5xl font-display font-black text-duoYellow drop-shadow-md">
            ¡Lección Completada!
          </h2>
          <p className="text-xl font-bold text-slate-600 dark:text-slate-300">
            Has dominado el módulo: <span className="text-slate-800 dark:text-white">{moduleName}</span>
          </p>

          <div className="flex gap-4 items-center justify-center my-6">
            <div className="bg-amber-100 dark:bg-amber-900/40 border-[3px] border-amber-300 dark:border-amber-700 rounded-[24px] p-6 w-32 flex flex-col items-center">
              <i className="fa-solid fa-star text-4xl text-amber-500 mb-2"></i>
              <span className="text-2xl font-black text-amber-700 dark:text-amber-300">+{stars}</span>
            </div>
            <div className="bg-blue-100 dark:bg-blue-900/40 border-[3px] border-blue-300 dark:border-blue-700 rounded-[24px] p-6 w-32 flex flex-col items-center">
              <i className="fa-solid fa-bolt text-4xl text-blue-500 mb-2"></i>
              <span className="text-2xl font-black text-blue-700 dark:text-blue-300">+{xpEarned}</span>
            </div>
          </div>

          <button
            onClick={() => setCurrentView('path')}
            className="w-full max-w-md bg-duoGreen border-x-2 border-t-2 border-b-[6px] border-black/10 text-white font-display font-black text-xl py-4 rounded-[24px] shadow-btn-green duo-pressable uppercase tracking-wider mt-8"
          >
            Continuar
          </button>
        </div>
      );
    }

    // --- PERFIL Y ESTADÍSTICAS ---
    function ProfileView({ xp, streak, nodeProgress, setCurrentView, isDarkMode, toggleDarkMode }) {
      const fileInputRef = useRef(null);

      const handleExport = () => {
        playSound('pop');
        const data = {
          lq_hearts: localStorage.getItem('lq_hearts'),
          lq_xp: localStorage.getItem('lq_xp'),
          lq_gems: localStorage.getItem('lq_gems'),
          lq_streak: localStorage.getItem('lq_streak'),
          lq_nodeProgress: localStorage.getItem('lq_nodeProgress')
        };
        const str = JSON.stringify(data);
        const enc = btoa(unescape(encodeURIComponent(str))).split('').reverse().join('');
        const blob = new Blob([enc], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'lenguaquest_progreso.txt';
        a.click();
      };

      const handleImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const content = event.target.result;
            let data;
            try {
               const dec = decodeURIComponent(escape(atob(content.split('').reverse().join(''))));
               data = JSON.parse(dec);
            } catch(e) {
               data = JSON.parse(content);
            }

            if (data.lq_xp !== undefined) {
               Object.keys(data).forEach(key => {
                 if(data[key] !== null) localStorage.setItem(key, data[key]);
               });
               playSound('success');
               alert("¡Tu progreso se ha restaurado correctamente!");
               window.location.reload();
            } else {
               alert("El archivo no tiene un formato válido para LenguaQuest.");
            }
          } catch(err) {
            alert("Error al leer el archivo.");
          }
        };
        reader.readAsText(file);
      };

      useEffect(() => {
        let completed = 0;
        const total = 56; 
        Object.values(nodeProgress).forEach(val => { if (val > 0) completed++; });
        let pending = total - completed;

        const ctx = document.getElementById('statsChart');
        let chartInstance = null;

        if (ctx) {
           chartInstance = new Chart(ctx, {
             type: 'doughnut',
             data: {
               labels: ['Completadas', 'Pendientes'],
               datasets: [{
                 data: [completed, pending],
                 backgroundColor: ['#58cc02', isDarkMode ? '#334155' : '#e2e8f0'],
                 borderWidth: 3,
                 hoverOffset: 4
               }]
             },
             options: { 
               responsive: true, 
               maintainAspectRatio: false,
               plugins: {
                 legend: { position: 'bottom', labels: { color: isDarkMode ? '#f8fafc' : '#1e293b', font: { family: 'Outfit', weight: 'bold' } } }
               }
             }
           });
        }
        return () => {
          if (chartInstance) chartInstance.destroy();
        };
      }, [nodeProgress, isDarkMode]);

      const leagues = [
        { name: "Liga Gramático", min: 0, max: 500, color: "text-amber-700 dark:text-amber-400", border: "border-amber-400", bg: "bg-amber-100 dark:bg-amber-950/50", icon: "fa-feather" },
        { name: "Liga Poeta", min: 500, max: 1500, color: "text-slate-600 dark:text-slate-300", border: "border-slate-400", bg: "bg-slate-200 dark:bg-slate-800", icon: "fa-scroll" },
        { name: "Liga Retórico", min: 1500, max: 3000, color: "text-yellow-600 dark:text-yellow-400", border: "border-yellow-400", bg: "bg-yellow-100 dark:bg-yellow-950/50", icon: "fa-book-bookmark" },
        { name: "Liga Académico", min: 3000, max: Infinity, color: "text-cyan-600 dark:text-cyan-400", border: "border-cyan-400", bg: "bg-cyan-100 dark:bg-cyan-950/50", icon: "fa-graduation-cap" }
      ];

      let currentLeagueIndex = leagues.findIndex(l => xp >= l.min && xp < l.max);
      if (currentLeagueIndex === -1) currentLeagueIndex = leagues.length - 1;
      const currentLeague = leagues[currentLeagueIndex];
      const nextLeague = leagues[currentLeagueIndex + 1];
      const progressPerc = nextLeague ? Math.min(100, Math.max(0, ((xp - currentLeague.min) / (nextLeague.min - currentLeague.min)) * 100)) : 100;

      return (
        <div className="max-w-4xl mx-auto space-y-8 pb-10">
          <div className="flex items-center justify-between">
            <button onClick={() => setCurrentView('path')} className="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full font-bold text-2xl transition-colors">
              <i className="fa-solid fa-arrow-left"></i>
            </button>
            <h2 className="text-3xl font-display font-black text-slate-800 dark:text-white">Mi Perfil Lingüístico</h2>
            <button onClick={toggleDarkMode} className="w-12 h-12 flex items-center justify-center text-amber-500 dark:text-yellow-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full font-bold text-2xl transition-colors">
              <i className={`fa-solid ${isDarkMode ? 'fa-sun' : 'fa-moon'}`}></i>
            </button>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white dark:bg-slate-900 rounded-[32px] p-6 sm:p-8 shadow-duo-card border-[3px] border-slate-200 dark:border-slate-800 space-y-6 transition-colors">
              <div className="flex items-center gap-4 border-b-2 border-slate-100 dark:border-slate-800 pb-6">
                <div className="w-20 h-20 bg-slate-100 dark:bg-slate-800 rounded-full flex items-center justify-center text-4xl text-duoBlue border-4 border-slate-200 dark:border-slate-700">
                  <i className="fa-solid fa-user-ninja"></i>
                </div>
                <div>
                  <h3 className="font-display font-black text-2xl text-slate-800 dark:text-white">Estudiante de Lengua</h3>
                  <p className="text-slate-500 dark:text-slate-400 font-bold text-sm mt-1">Explorador del Lenguaje (PRO)</p>
                </div>
              </div>
              
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-[20px] border-2 border-slate-200 dark:border-slate-700 flex flex-col">
                  <i className="fa-solid fa-fire text-duoOrange text-2xl mb-2"></i>
                  <span className="font-display font-black text-xl text-slate-800 dark:text-white">{streak} Días</span>
                  <span className="text-xs text-slate-400 font-bold">Racha de estudio</span>
                </div>
                <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-[20px] border-2 border-slate-200 dark:border-slate-700 flex flex-col">
                  <i className="fa-solid fa-bolt text-duoBlue text-2xl mb-2"></i>
                  <span className="font-display font-black text-xl text-slate-800 dark:text-white">{xp} XP</span>
                  <span className="text-xs text-slate-400 font-bold">Experiencia total</span>
                </div>
              </div>
            </div>

            <div className="bg-white dark:bg-slate-900 rounded-[32px] p-6 sm:p-8 shadow-duo-card border-[3px] border-slate-200 dark:border-slate-800 space-y-4 transition-colors">
              <h3 className="font-display font-black text-xl text-slate-800 dark:text-white border-b-2 border-slate-100 dark:border-slate-800 pb-4">Progreso del Temario</h3>
              <div className="relative w-full h-[200px]">
                <canvas id="statsChart"></canvas>
              </div>
            </div>
          </div>

          <div className="bg-gradient-to-b from-white to-blue-50 dark:from-slate-900 dark:to-slate-800/80 rounded-[32px] p-6 sm:p-8 shadow-duo-card border-[3px] border-blue-200 dark:border-blue-900/50 space-y-6 transition-colors">
            <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between border-b-2 border-blue-100 dark:border-slate-700 pb-4 gap-4">
              <h3 className="font-display font-black text-2xl text-blue-900 dark:text-blue-300 flex items-center gap-3">
                <i className="fa-solid fa-trophy text-blue-500 text-3xl"></i>
                Ligas de Clasificación
              </h3>
            </div>
            
            <div className="flex items-center gap-6">
              <div className={`w-24 h-24 rounded-full flex items-center justify-center text-4xl shadow-sm border-4 shrink-0 ${currentLeague.bg} ${currentLeague.color} ${currentLeague.border}`}>
                <i className={`fa-solid ${currentLeague.icon}`}></i>
              </div>
              <div className="flex-1 w-full space-y-2">
                <h4 className="font-display font-black text-slate-800 dark:text-white text-2xl">{currentLeague.name}</h4>
                {nextLeague && (
                  <>
                    <p className="text-sm font-bold text-slate-500 dark:text-slate-400">
                      {xp} XP / {nextLeague.min} XP para {nextLeague.name}
                    </p>
                    <div className="w-full bg-slate-200 dark:bg-slate-700 h-4 rounded-full overflow-hidden border-2 border-slate-300 dark:border-slate-600">
                      <div className="bg-duoBlue h-full transition-all duration-500 rounded-full" style={{ width: `${progressPerc}%` }}></div>
                    </div>
                  </>
                )}
              </div>
            </div>
          </div>

          <div className="bg-slate-50 dark:bg-slate-900 rounded-[32px] p-6 sm:p-8 border-2 border-slate-200 dark:border-slate-800 space-y-4 transition-colors">
            <div className="text-center pb-2">
              <h3 className="font-display font-black text-lg text-slate-800 dark:text-white">Copia de Seguridad de Progreso</h3>
            </div>
            
            <div className="flex flex-col sm:flex-row gap-4 justify-center pt-2">
              <button onClick={handleExport} className="bg-white dark:bg-slate-800 text-duoBlueDark dark:text-duoBlue font-display font-black py-4 px-6 rounded-[20px] shadow-sm border-[3px] border-slate-200 dark:border-slate-700 border-b-[6px] duo-pressable flex items-center justify-center gap-3 hover:bg-slate-50 dark:hover:bg-slate-700">
                <i className="fa-solid fa-download"></i> Exportar
              </button>
              
              <input type="file" accept=".txt,.json" ref={fileInputRef} onChange={handleImport} className="hidden" />
              <button onClick={() => fileInputRef.current.click()} className="bg-white dark:bg-slate-800 text-duoEmeraldDark dark:text-duoEmerald font-display font-black py-4 px-6 rounded-[20px] shadow-sm border-[3px] border-slate-200 dark:border-slate-700 border-b-[6px] duo-pressable flex items-center justify-center gap-3 hover:bg-slate-50 dark:hover:bg-slate-700">
                <i className="fa-solid fa-upload"></i> Importar
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- MAPA RUTA DE APRENDIZAJE ---
    function PathMap({ selectedChapter, setSelectedChapter, nodeProgress, setCurrentView }) {
      const CHAPTER_DATA = window.QuestionBank.CHAPTER_DATA;
      const chapter = CHAPTER_DATA[selectedChapter];

      const nodes = [

                  onClick={() => {
                    playSound('pop');

                  className={`flex-1 min-w-[200px] p-4 rounded-[24px] border-b-[6px] border-2 font-display font-black text-left transition-all active:translate-y-1 active:border-b-2 ${

                      ? `${chap.color} text-white shadow-duo-3d border-black/20 scale-[1.02]`

                >

                    <span>TEMA {chap.id}</span>

                  <div className="text-base line-clamp-1">{chap.title.split(': ')[1] || chap.title}</div>
                </button>

            })}
          </div>

          <div className={`${chapter.color} text-white p-8 rounded-[32px] shadow-duo-3d border-b-[8px] border-2 border-black/20 relative overflow-hidden`}>
            <div className="relative z-10 max-w-xl space-y-3">
              <span className="bg-white/20 backdrop-blur-md px-4 py-1 rounded-full text-xs font-black uppercase tracking-widest border border-white/30">
                Unidad {chapter.id}
              </span>
              <h2 className="text-3xl sm:text-4xl font-display font-black leading-tight drop-shadow-md">

              <p className="text-white/90 text-base font-bold">
                {chapter.desc}
              </p>
            </div>
            <i className="fa-solid fa-book-open absolute -right-6 -bottom-10 text-[180px] opacity-15 pointer-events-none transform -rotate-12"></i>
          </div>

          <div className="relative py-8 flex flex-col items-center space-y-12 w-full max-w-md mx-auto">
            <div className="absolute top-8 bottom-24 left-1/2 w-8 bg-slate-200 dark:bg-slate-800 -translate-x-1/2 rounded-full z-0 border-x-[3px] border-slate-300 dark:border-slate-700 opacity-60"></div>

            {nodes.map((node, index) => {
              const progressKey = `c${selectedChapter}_${node.key}`;
              const stars = nodeProgress[progressKey] || 0;
              const offsetClass = index % 2 === 0 ? '-translate-x-16 sm:-translate-x-24' : 'translate-x-16 sm:translate-x-24';
              const isCompleted = stars > 0;
              const activeColor = isCompleted ? 'bg-amber-400 shadow-btn-yellow border-amber-500 text-amber-900' : `${node.color} ${node.shadow} text-white border-black/20`;

              return (
                <div key={node.key} className={`relative flex flex-col items-center ${offsetClass} z-10`}>
                  <button
                    onClick={() => { playSound('pop'); setCurrentView(node.key); }}
                    className={`w-24 h-24 sm:w-28 sm:h-28 rounded-full ${activeColor} flex flex-col items-center justify-center text-3xl sm:text-4xl font-black transition-transform hover:scale-110 active:scale-95 border-b-[8px] border-2 relative group shadow-lg`}
                  >
                    <i className={`fa-solid ${isCompleted ? 'fa-check text-4xl' : node.icon}`}></i>
                    {stars > 0 && (
                      <div className="absolute -top-4 bg-white dark:bg-slate-800 text-amber-500 border-4 border-amber-400 text-sm px-3 py-1 rounded-full font-black flex items-center gap-1.5 shadow-md transform rotate-6 animate-float-duo">
                        <i className="fa-solid fa-crown text-xs"></i>
                        <span>{stars}</span>
                      </div>
                    )}
                  </button>

                  <div className="absolute -bottom-8 w-[160px] text-center">
                    <span className="font-display font-black text-sm text-slate-500 dark:text-slate-400">
                      {node.name}
                    </span>
                  </div>
                </div>
              );
            })}

            <div className="relative flex flex-col items-center pt-16 z-10">
              <button
                onClick={() => { playSound('pop'); setCurrentView('extraKahoot'); }}
                className="w-32 h-32 sm:w-36 sm:h-36 rounded-full bg-gradient-to-br from-amber-400 via-duoOrange to-duoRed shadow-btn-red text-white flex flex-col items-center justify-center text-5xl font-black transition-transform hover:scale-110 active:scale-95 border-b-[10px] border-4 border-amber-200 relative group animate-float-duo"
              >
                <i className="fa-solid fa-graduation-cap text-amber-100 mb-1"></i>
                <span className="text-[11px] font-black uppercase tracking-wider bg-black/40 px-3 py-1 rounded-full border border-white/30">
                  EXAMEN
                </span>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // --- TIENDA ---
    function ShopView({ gems, setGems, hearts, setHearts, inventory, setInventory, setCurrentView }) {

          color: 'bg-duoBlue text-white',
          btnColor: 'bg-duoBlue shadow-btn-blue hover:bg-duoBlueDark',

          color: 'bg-duoPurple text-white',
          btnColor: 'bg-duoPurple shadow-btn-purple hover:bg-duoPurpleDark',

          disabledText: 'Gemas Insuficientes',

      return (

          <div className="flex items-center justify-between">
            <button onClick={() => setCurrentView('path')} className="w-12 h-12 flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-full font-bold text-2xl transition-colors">
              <i className="fa-solid fa-xmark"></i>
            </button>
            <span className="bg-emerald-100 dark:bg-emerald-950/60 text-duoEmeraldDark dark:text-duoEmerald border-2 border-emerald-200 dark:border-emerald-800 text-sm font-black px-4 py-2 rounded-2xl shadow-sm flex items-center gap-2">
              <i className="fa-solid fa-gem text-amber-400 text-lg"></i>
              {gems} Gemas
            </span>
          </div>

          <div className="text-center space-y-4">
            <div className="w-24 h-24 bg-amber-100 dark:bg-amber-950/50 text-amber-500 rounded-[28px] flex items-center justify-center text-5xl mx-auto border-[4px] border-amber-200 dark:border-amber-800 shadow-sm animate-float-duo">
              <i className="fa-solid fa-store"></i>
            </div>
            <h2 className="text-3xl sm:text-4xl font-display font-black text-slate-800 dark:text-white">
              Tienda de Ventajas
            </h2>
          </div>

          <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
            {shopItems.map(item => (
              <div key={item.id} className="bg-white dark:bg-slate-800/80 border-[3px] border-slate-200 dark:border-slate-700 rounded-[24px] p-5 flex flex-col justify-between space-y-5 hover:border-slate-300 transition-colors shadow-sm">
                <div className="space-y-3">
                  <div className="flex items-center justify-between">

                    </div>
                    {item.ownedText && (
                      <span className="text-xs font-black bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 px-3 py-1.5 rounded-xl">

                      </span>
                    )}
                  </div>
                  <h3 className="font-display font-black text-slate-800 dark:text-white text-xl">{item.title}</h3>

                    item.disabled 
                      ? 'bg-slate-100 dark:bg-slate-700 text-slate-400 border-slate-200 shadow-none' 
                      : `${item.btnColor} border-black/10`

                >
                  {item.disabled ? (
                    <span>{item.disabledText}</span>
